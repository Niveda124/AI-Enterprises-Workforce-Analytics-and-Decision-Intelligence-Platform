{% extends 'emp_index.html' %}
{% block body %}
<style>
  .rc-wrap { padding:24px; background:#f4f6fb; }
  .rc-wrap h1 { margin:0 0 20px; font-size:22px; color:#1e1b4b; }
  .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 2px 12px rgba(30,27,75,0.06); max-width:640px; }
  label { font-size:12px; font-weight:700; color:#4b5563; display:block; margin-bottom:4px; margin-top:14px; }
  select, input[type=text], textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #e2e4ee; font-size:13px; box-sizing:border-box; }
  textarea { min-height:100px; }
  .btn { background:linear-gradient(135deg,#6366f1,#4338ca); color:#fff; padding:11px 22px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; margin-top:18px; }
  .msg { padding:10px; border-radius:8px; margin-bottom:14px; font-size:13px; }
  .msg.success { background:#f0fdf4; color:#166534; } .msg.error { background:#fef2f2; color:#991b1b; }
</style>
<section id="main-content">
  <section class="wrapper rc-wrap">
    <h1>Request Clarification</h1>
    <div class="card">
      {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <label>Related Task (optional)</label>
        <select name="related_task">
          <option value="">-- None --</option>
          {% for t in my_tasks %}<option value="{{ t.id }}">{{ t.title }}</option>{% endfor %}
        </select>
        <label>Task reference (free text, optional)</label>
        <input type="text" name="task_reference" placeholder="e.g. Implement login validation">
        <label>Your question</label>
        <textarea name="question" required placeholder="e.g. Should invalid passwords be logged or only displayed to the user?"></textarea>
        <button type="submit" class="btn">Send Question to Admin</button>
      </form>
    </div>
  </section>
</section>
{% endblock %}
